			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# zn dev on a real iPhone (Debug builds only, as zero-native's ios/cmake/ZnDev.cmake): Local Network access and the Bonjour type `zn dev --lan` advertises. Release builds keep App/Info.plist as it is.\n# ZN_DEV_HOST (a build setting: the Mac's address, or host:port): connect there first (Bonjour after 3 failed tries).\nset -e\n[ \"$CONFIGURATION\" = \"Debug\" ] || exit 0\np=\"$TARGET_BUILD_DIR/$INFOPLIST_PATH\"\npb=/usr/libexec/PlistBuddy\n$pb -c \"Print :NSLocalNetworkUsageDescription\" \"$p\" >/dev/null 2>&1 || $pb -c \"Add :NSLocalNetworkUsageDescription string Debug builds connect to zn dev on your Mac for live reload.\" \"$p\"\n$pb -c \"Print :NSBonjourServices\" \"$p\" >/dev/null 2>&1 || $pb -c \"Add :NSBonjourServices array\" \"$p\"\n$pb -c \"Print :NSBonjourServices\" \"$p\" | grep -q \"_zn-dev._tcp\" || $pb -c \"Add :NSBonjourServices:0 string _zn-dev._tcp\" \"$p\"\n$pb -c \"Delete :ZNDevHost\" \"$p\" >/dev/null 2>&1 || true\n[ -z \"$ZN_DEV_HOST\" ] || $pb -c \"Add :ZNDevHost string $ZN_DEV_HOST\" \"$p\"\n# ZNDevMac: this Mac, so the app prefers this Mac's zn dev when Bonjour sees several.\n$pb -c \"Delete :ZNDevMac\" \"$p\" >/dev/null 2>&1 || true\nmac=$(scutil --get LocalHostName 2>/dev/null || true)\n[ -z \"$mac\" ] || $pb -c \"Add :ZNDevMac string $mac\" \"$p\"\n";
		};
