# Checks every push to main and every pull request (docs/production-readiness.md A3).
# - js: the JS, compiler, plugin, tools and server tests, and the type check (`bun run test`).
# - ios: the C++ core tests on the Mac, the OTA rule tests, the iOS sample built for the simulator (Debug), and the
#   iOS sample built for an iPhone (Release, release Hermes, not signed).
# - android: the sample's debug build, every module's unit tests, and lint for the runtime and the sample.
# - android-release: the sample's release build (R8 and resource shrinking, lintVital). Signed with the debug key, as
#   android/sample/build.gradle.kts says; the Android Gradle plugin makes that key on the runner, so no keystore secret.
# Nothing here needs a secret: Firebase, Lottie and the apps' Firebase config files are optional, and the builds run
# without them (the Firebase plugins answer "unavailable").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Builds the sample's JS (and, on a fresh clone, test-kit/offers-data.json from the example the type check needs).
      - run: bun run sample:js
      - run: bun run test
      # The 25 npm packages, packed as `npm publish` would send them (nothing is uploaded): no workspace ranges left,
      # no test files, LICENSE and NOTICE in each (docs/publishing-plan.md §2.1).
      - run: bun run tools/pack.ts --out "$RUNNER_TEMP/npm"

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run sample:js
      # Meta's prebuilt Hermes, pinned by version and SHA-256 in the script. Debug (tests, simulator) and release (the
      # iPhone Release build) are cached apart, so each cache holds what its step fetched.
      - uses: actions/cache@v4
        with:
          path: ios/third_party/hermes/debug
          key: hermes-apple-debug-${{ hashFiles('tools/fetch-hermes-apple.ts') }}
      - uses: actions/cache@v4
        with:
          path: ios/third_party/hermes/release
          key: hermes-apple-release-${{ hashFiles('tools/fetch-hermes-apple.ts') }}
      - run: bun run tools/fetch-hermes-apple.ts
      - run: bun run tools/fetch-hermes-apple.ts release
      - name: C++ core tests (Mac)
        run: bun run tools/run-core-tests-apple.ts
      - name: OTA rule tests
        run: bun run ios:ota-test
      - name: Build the iOS sample (simulator)
        run: |
          cmake -G Xcode -S ios -B ios/build/sim -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          xcodebuild -project ios/build/sim/zn_ios.xcodeproj -target ZnSample -sdk iphonesimulator \
            -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build -quiet
      # What a store build compiles: Release, the device SDK, release Hermes (a Release build with debug Hermes stops).
      # Not signed: CI has no certificate. Its own build folder, because CMake picks the Hermes slice when it configures.
      - name: Build the iOS sample (iPhone, Release)
        run: |
          cmake -G Xcode -S ios -B ios/build/device -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DZN_HERMES_DIR="$GITHUB_WORKSPACE/ios/third_party/hermes/release/destroot"
          xcodebuild -project ios/build/device/zn_ios.xcodeproj -target ZnSample -sdk iphoneos \
            -configuration Release ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build -quiet

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools  # its default also asks for "tools", which the SDK no longer has (the first run failed)
      # The platform, NDK and CMake that android/runtime and android/sample ask for (compileSdk 37, ndkVersion, cmake
      # version) are installed by the Android Gradle plugin itself (setup-android accepted the licenses): it knows their
      # package names ("platforms;android-37" isn't one; the second run failed on it). Shown here in case they move.
      - name: SDK packages for API 37 (for the log)
        run: sdkmanager --list --channel=3 2>/dev/null | grep -E "platforms;android-37|ndk;30\.|cmake;4\.1" | sort -u || true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The sample's main.hbc, templates and assets go into android/sample/src/main/assets.
      - run: bun run sample:js
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the sample and run the unit tests
        working-directory: android
        run: ./gradlew :sample:assembleDebug testDebugUnitTest --stacktrace
      # The lint docs/milestones.md "Tests" asks for (0 errors). Warnings don't fail it; errors do.
      - name: Lint (runtime and sample)
        working-directory: android
        run: ./gradlew :runtime:lintDebug :sample:lintDebug --stacktrace
      - name: Keep the lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: android/*/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # Its own job, so it runs beside the debug build: the release build compiles the C++ core again for every CPU type
  # the runtime's release ships (arm64-v8a, armeabi-v7a, x86, x86_64), then R8 runs.
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools  # as in the android job
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run sample:js
      - uses: gradle/actions/setup-gradle@v4
      # assembleRelease also runs lintVitalRelease (the fatal lint checks) on the sample.
      - name: Build the sample's release (R8)
        working-directory: android
        run: ./gradlew :sample:assembleRelease --stacktrace
      - name: APK size (for the log)
        run: ls -l android/sample/build/outputs/apk/release/
