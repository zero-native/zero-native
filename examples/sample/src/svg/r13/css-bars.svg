<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Registry 13: CSS extras. Custom properties with var(), :nth-child delays, :not(), and @media. -->
  <style>
    :root { --bar: #3D26ED; --speed: 0.9s; }
    .bars > rect { fill: var(--bar); transform-box: fill-box; transform-origin: center; animation: grow var(--speed) ease-in-out infinite; }
    .bars > rect:nth-child(2) { animation-delay: -0.3s; }
    .bars > rect:nth-child(3) { animation-delay: -0.6s; }
    .bars > rect:not(:first-child) { fill: var(--accent, #6D5BF5); }
    @keyframes grow { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .bars > rect { animation: none; } }
  </style>
  <g class="bars">
    <rect x="9" y="10" width="7" height="28" rx="3.5"/>
    <rect x="20.5" y="10" width="7" height="28" rx="3.5"/>
    <rect x="32" y="10" width="7" height="28" rx="3.5"/>
  </g>
</svg>
