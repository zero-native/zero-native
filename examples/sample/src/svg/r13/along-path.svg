<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Registry 13: animateMotion. An arrow follows the curve and turns with it (rotate="auto"). -->
  <path id="track" d="M6 36C14 4 34 4 42 36" fill="none" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M-4 -3.5L5 0L-4 3.5z" fill="currentColor">
    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">
      <mpath href="#track"/>
    </animateMotion>
  </path>
</svg>
