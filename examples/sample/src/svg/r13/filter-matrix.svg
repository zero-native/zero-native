<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Registry 13: feColorMatrix. The same colourful badge twice: on the left as it is, on the right through
       type="saturate" values="0" (grey, darker where the colour is darker). -->
  <defs>
    <filter id="grey" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <g id="badge">
      <circle cx="11" cy="24" r="10" fill="#F59E0B"/>
      <path d="M11 16 L13.4 21.2 L19 21.6 L14.7 25.2 L16.1 30.6 L11 27.6 L5.9 30.6 L7.3 25.2 L3 21.6 L8.6 21.2 Z" fill="#E11D48"/>
      <circle cx="11" cy="24" r="2.2" fill="#3D26ED"/>
    </g>
  </defs>
  <use href="#badge"/>
  <g filter="url(#grey)">
    <use href="#badge" x="26"/>
  </g>
</svg>
