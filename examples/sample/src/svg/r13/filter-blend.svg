<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Registry 13: feFlood, feBlend and feComposite. Top: a grey-to-white bar tinted orange by multiply (darker on
       the left), cut back to its own shape (composite in), so the corners stay clear. Bottom: text with a soft
       indigo glow under it (blur merged under the source); the text must be the right way up. -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="tint" x="0" y="0" width="100%" height="100%">
      <feFlood flood-color="#F59E0B" result="orange"/>
      <feBlend mode="multiply" in="orange" in2="SourceGraphic" result="mixed"/>
      <feComposite in="mixed" in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- In user units: the compiler gives text no box, so a filter in object units would hide it. -->
    <filter id="glow" x="8" y="24" width="32" height="20" filterUnits="userSpaceOnUse">
      <feFlood flood-color="#4F46E5"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feGaussianBlur stdDeviation="1.6" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="6" y="7" width="36" height="14" rx="7" fill="url(#fade)" filter="url(#tint)"/>
  <g filter="url(#glow)">
    <text x="24" y="38" font-size="12" font-weight="800" text-anchor="middle" fill="#FFFFFF">zn</text>
  </g>
</svg>
